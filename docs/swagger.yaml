definitions:
  server.addACL:
    properties:
      allow_all:
        description: when true, client is allowed to access everything
        example: false
        type: boolean
      allowed_hosts:
        description: represents a list of host headers the client is allowed to access
        example:
        - git.example.com
        - wiki.example.com
        items:
          type: string
        type: array
      ttl:
        description: after this date, the ACL is no longer valid (RFC3339 format)
        example: "2025-12-31T23:59:59Z"
        type: string
      user_ids:
        description: Users associated with this ACL
        example:
        - 5e8848
        - a3f129
        items:
          type: string
        type: array
    type: object
  server.addUser:
    properties:
      acl_allow_all:
        description: Determines if this User is allowed to access ALL resources
        example: false
        type: boolean
      acl_allowed_hosts:
        description: A list of hosts (FQDN) this User is allowed to access
        example:
        - git.example.com
        - wiki.example.com
        items:
          type: string
        type: array
      description:
        description: A brief description of this User
        example: Cloud Strife
        type: string
      dns_names:
        description: A list of DNS names that resolve this User's IPs which get whitelisted
          automatically without a challenge.
        example:
        - myhome.no-ip.info
        items:
          type: string
        type: array
      enabled:
        description: Determines if this User is enabled
        example: true
        type: boolean
      id:
        description: A unique identifier for this User (4-64 characters)
        example: cloud
        type: string
      secret:
        description: This secret is used as a challenge to whitelist a User's IP
        example: supersecret
        type: string
      ttl_minutes:
        description: Represents the number of minutes this User's IP is whitelisted
          for after a successful challenge
        example: 60
        type: integer
    type: object
  server.errorResponse:
    properties:
      error:
        type: string
    type: object
  server.getACL:
    properties:
      allow_all:
        description: when true, client is allowed to access everything
        example: false
        type: boolean
      allowed_hosts:
        description: represents a list of host headers the client is allowed to access
        example:
        - git.example.com
        - wiki.example.com
        items:
          type: string
        type: array
      ip_address:
        description: IP address this ACL applies to
        example: 192.168.1.100
        type: string
      ttl:
        description: after this date, the ACL is no longer valid (RFC3339 format)
        example: "2025-12-31T23:59:59Z"
        type: string
      user_ids:
        description: Users associated with this ACL
        example:
        - 5e8848
        - a3f129
        items:
          type: string
        type: array
    type: object
  server.getUser:
    properties:
      acl_allow_all:
        description: Determines if this User is allowed to access ALL resources
        example: false
        type: boolean
      acl_allowed_hosts:
        description: A list of hosts (FQDN) this User is allowed to access
        example:
        - git.example.com
        - wiki.example.com
        items:
          type: string
        type: array
      description:
        description: A brief description of this User
        example: Cloud Strife
        type: string
      dns_names:
        description: A list of DNS names that resolve this User's IPs which get whitelisted
          automatically without a challenge.
        example:
        - myhome.no-ip.info
        items:
          type: string
        type: array
      enabled:
        description: Determines if this User is enabled
        example: true
        type: boolean
      id:
        description: A unique identifier for this User (4-64 characters)
        example: cloud
        type: string
      ttl_minutes:
        description: Represents the number of minutes this User's IP is whitelisted
          for after a successful challenge
        example: 60
        type: integer
    type: object
  server.modifyACL:
    properties:
      allow_all:
        description: when true, client is allowed to access everything
        example: false
        type: boolean
      allowed_hosts:
        description: represents a list of host headers the client is allowed to access
        example:
        - git.example.com
        - wiki.example.com
        items:
          type: string
        type: array
      ttl:
        description: after this date, the ACL is no longer valid (RFC3339 format)
        example: "2025-12-31T23:59:59Z"
        type: string
      user_ids:
        description: Users associated with this ACL
        example:
        - 5e8848
        - a3f129
        items:
          type: string
        type: array
    type: object
  server.modifyUser:
    properties:
      acl_allow_all:
        description: Determines if this User is allowed to access ALL resources
        example: false
        type: boolean
      acl_allowed_hosts:
        description: A list of hosts (FQDN) this User is allowed to access
        example:
        - git.example.com
        - wiki.example.com
        items:
          type: string
        type: array
      description:
        description: A brief description of this User
        example: Cloud Strife
        type: string
      dns_names:
        description: A list of DNS names that resolve this User's IPs which get whitelisted
          automatically without a challenge.
        example:
        - myhome.no-ip.info
        items:
          type: string
        type: array
      enabled:
        description: Determines if this User is enabled
        example: true
        type: boolean
      ttl_minutes:
        description: Represents the number of minutes this User's IP is whitelisted
          for after a successful challenge
        example: 60
        type: integer
    type: object
  server.version:
    properties:
      build_ref:
        example: git-30b8019
        type: string
      version:
        example: v1.0
        type: string
    type: object
info:
  contact: {}
paths:
  /acl:
    get:
      description: Returns a list of all ACLs
      parameters:
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.getACL'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Get all ACLs
      tags:
      - ACL Management
  /acl/{ip}:
    delete:
      description: Deletes an ACL for a specific IP address
      parameters:
      - description: IP Address
        in: path
        name: ip
        required: true
        type: string
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.getACL'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Delete an ACL
      tags:
      - ACL Management
    get:
      description: Returns ACL details for a specific IP address
      parameters:
      - description: IP Address
        in: path
        name: ip
        required: true
        type: string
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.getACL'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Get ACL details
      tags:
      - ACL Management
    post:
      consumes:
      - application/json
      description: Creates a new ACL for an IP address
      parameters:
      - description: IP Address
        in: path
        name: ip
        required: true
        type: string
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      - description: ACL configuration
        in: body
        name: acl
        required: true
        schema:
          $ref: '#/definitions/server.addACL'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.getACL'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Add a new ACL
      tags:
      - ACL Management
    put:
      consumes:
      - application/json
      description: Updates ACL configuration for an IP address
      parameters:
      - description: IP Address
        in: path
        name: ip
        required: true
        type: string
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      - description: ACL configuration
        in: body
        name: acl
        required: true
        schema:
          $ref: '#/definitions/server.modifyACL'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.getACL'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Update an existing ACL
      tags:
      - ACL Management
  /authorize:
    get:
      description: Configure NGINX auth_request to this endpoint
      parameters:
      - description: IP address of the user
        in: header
        name: X-Real-IP
        required: true
        type: string
      - description: the host (FQDN) the user is making a request to
        in: header
        name: Host
        type: string
      responses:
        "200":
          description: access granted
        "401":
          description: unauthorized - user IP is unknown or not permitted to access
            this host
      summary: NGINX auth_request destination
      tags:
      - Authorization
  /challenge:
    post:
      description: A user must successfully POST to this URL in order for their IP
        address to be granted access
      parameters:
      - description: IP address of the user
        in: header
        name: X-Real-IP
        required: true
        type: string
      - description: User ID (4-64 characters)
        in: header
        name: User-ID
        required: true
        type: string
      - description: Secret that was given to/by the user
        in: header
        name: User-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'challenge was accepted: the value of X-Real-IP has been granted
            an ACL'
        "400":
          description: 'bad request: X-Real-IP is not set or User-ID is invalid'
        "401":
          description: 'unauthorized: the user secret is incorrect or the user is
            disabled'
        "500":
          description: server could not process the request
      summary: Challenge used to authorize an IP address for access
      tags:
      - Authorization
  /user:
    get:
      description: Returns a list of all users
      parameters:
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.getUser'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Get all users
      tags:
      - User Management
    post:
      consumes:
      - application/json
      description: Creates a new user with the provided configuration. User ID must
        be provided (4-64 characters).
      parameters:
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      - description: User configuration
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/server.addUser'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.getUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Add a new user
      tags:
      - User Management
  /user/{id}:
    delete:
      description: Deletes a user from the system
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.getUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Delete a user
      tags:
      - User Management
    get:
      description: Returns details for a specific user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.getUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Get user details
      tags:
      - User Management
    put:
      consumes:
      - application/json
      description: Updates user configuration
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Admin secret for authentication
        in: header
        name: Admin-Secret
        required: true
        type: string
      - description: User configuration
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/server.modifyUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.getUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Update an existing user
      tags:
      - User Management
  /version:
    get:
      description: Returns version information about this server
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.version'
      summary: Version information
      tags:
      - Information
swagger: "2.0"
