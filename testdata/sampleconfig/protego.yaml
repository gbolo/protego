# database options
db:
  # provider options are: bolt, memory
  provider: memory
  # settings for Bolt data provider
  bolt:
    # path to database file
    file: ./testdata/db/protego.db

# ttl options
ttl:

  # maximum TTL in minutes that an individual ACL can have.
  # NOTE: a value of 0 means unlimited (ACLs can be made to never expire! use with caution)
  max: 129600 # 90 days

# options for admin
admin:
  secret: supersecret

  # the admin listener serves the admin API, the admin UI, the swagger docs and
  # the metrics dashboard, plus the /api/v1/authorize endpoint used by your
  # reverse proxy. None of these should be reachable from the internet, so bind
  # this to loopback or a private interface only.
  bind_address: 127.0.0.1

  # port for the admin listener. Must differ from server.bind_port.
  bind_port: 8081

# public http server settings.
# this listener only serves the challenge UI and the challenge endpoint
server:

  # local interface to bind to
  bind_address: 0.0.0.0

  # port to listen on
  bind_port: 8080

  # enable access log on stdout
  access_log: false

  # enable supported compression of http responses when client requests for it
  # currently only gzip is supported
  compression: false

  # enable the golang debug profiler:
  #   pprof available at /debug/pprof
  #   mem stats available at /debug/vars
  enable_profiler: false

  # TLS options
  tls:
    # enables TLS
    enabled: false

    # path to pem encoded x509 certificate chain
    # should include the following x509 certs: server > intermediate CA 1 > ... > intermediate CA X
    cert_chain: ./testdata/tls/server_agent-chain.pem

    # path to pem encoded pkcs1/8 private key
    private_key: ./testdata/tls/server_agent-key.pem

    # enabled mutual TLS (client cert authentication)
    client_auth_enabled: false

    # path to pem encoded x509 CA certificate used to validate HQ client cert
    client_auth_ca: ./testdata/tls/ca_root.pem
