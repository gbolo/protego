<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protego Admin</title>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
            </div>
            <h1>Protego Administration</h1>
            <p class="subtitle">Manage ACLs and Users</p>
        </header>

        <!-- Authentication Section -->
        <div id="auth-section">
            <div class="auth-card">
                <h2><i class="fi fi-rr-lock"></i> Admin Authentication</h2>
                <div class="form-group">
                    <label>Admin Secret</label>
                    <input type="password" id="admin-secret" placeholder="Enter admin secret">
                </div>
                <button class="btn btn-primary btn-block" id="auth-button">
                    <i class="fi fi-rr-unlock"></i>
                    <span>Authenticate</span>
                </button>
                <div id="auth-error" class="message message-error" style="display: none;"></div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" style="display: none;">
            
            <!-- Stats Cards -->
            <div class="stats-container" id="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalACLs">-</div>
                    <div class="stat-label">Total ACLs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalUsers">-</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="enabledUsers">-</div>
                    <div class="stat-label">Enabled Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="disabledUsers">-</div>
                    <div class="stat-label">Disabled Users</div>
                </div>
            </div>

            <!-- Global Notification -->
            <div id="global-notification" class="message" style="display: none;"></div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="acls">
                    <i class="fi fi-rr-shield-check"></i>
                    <span>ACLs</span>
                </button>
                <button class="tab" data-tab="users">
                    <i class="fi fi-rr-users-alt"></i>
                    <span>Users</span>
                </button>
            </div>

            <!-- ACL Content -->
            <div id="acls-content" class="content-section active">
                <div class="action-bar">
                    <div class="action-buttons">
                        <button class="action-btn btn-primary" id="add-acl-btn">
                            <i class="fi fi-rr-plus"></i>
                            <span>Add ACL</span>
                        </button>
                        <button class="action-btn btn-secondary" id="refresh-acls-btn">
                            <i class="fi fi-rr-refresh"></i>
                            <span>Refresh</span>
                        </button>
                    </div>
                    <span class="last-updated" id="acl-last-updated"></span>
                </div>

                <div id="acl-loading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Loading ACLs...</p>
                </div>

                <div id="acls-container" class="items-container" style="display: none;"></div>
            </div>

            <!-- Users Content -->
            <div id="users-content" class="content-section">
                <div class="action-bar">
                    <div class="action-buttons">
                        <button class="action-btn btn-primary" id="add-user-btn">
                            <i class="fi fi-rr-user-add"></i>
                            <span>Add User</span>
                        </button>
                        <button class="action-btn btn-secondary" id="refresh-users-btn">
                            <i class="fi fi-rr-refresh"></i>
                            <span>Refresh</span>
                        </button>
                    </div>
                    <span class="last-updated" id="user-last-updated"></span>
                </div>

                <div id="user-loading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Loading Users...</p>
                </div>

                <div id="users-container" class="items-container" style="display: none;"></div>
            </div>

        </div>
    </div>

    <!-- ACL Modal -->
    <div id="acl-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeACLModal()">&times;</span>
            <h2 id="acl-modal-title">Add ACL</h2>
            
            <div class="form-group">
                <label>IP Address *</label>
                <input type="text" id="acl-ip" placeholder="192.168.1.100">
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="acl-allow-all">
                    <span>Allow All Hosts</span>
                </label>
            </div>

            <div class="form-group">
                <label>Allowed Hosts <span class="help-text">(comma-separated)</span></label>
                <input type="text" id="acl-allowed-hosts" placeholder="git.example.com, wiki.example.com">
            </div>

            <div class="form-group">
                <label>User IDs <span class="help-text">(comma-separated)</span></label>
                <input type="text" id="acl-user-ids" placeholder="user1, user2">
            </div>

            <div class="form-group">
                <label>TTL <span class="help-text">(RFC3339 format)</span></label>
                <input type="text" id="acl-ttl" placeholder="2025-12-31T23:59:59Z">
                <small>Leave empty for no expiration</small>
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" id="save-acl-btn">
                    <i class="fi fi-rr-disk"></i>
                    <span>Save</span>
                </button>
                <button class="btn btn-secondary" onclick="closeACLModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- User Modal -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeUserModal()">&times;</span>
            <h2 id="user-modal-title">Add User</h2>
            
            <div class="form-group" id="user-secret-field">
                <label>Secret * <span class="help-text">(required for new users)</span></label>
                <input type="password" id="user-secret" placeholder="User secret">
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="user-enabled" checked>
                    <span>Enabled</span>
                </label>
            </div>

            <div class="form-group">
                <label>Description</label>
                <input type="text" id="user-description" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="user-acl-allow-all">
                    <span>ACL Allow All</span>
                </label>
            </div>

            <div class="form-group">
                <label>ACL Allowed Hosts <span class="help-text">(comma-separated)</span></label>
                <input type="text" id="user-acl-allowed-hosts" placeholder="git.example.com, wiki.example.com">
            </div>

            <div class="form-group">
                <label>DNS Names <span class="help-text">(comma-separated)</span></label>
                <input type="text" id="user-dns-names" placeholder="myhome.no-ip.info">
            </div>

            <div class="form-group">
                <label>TTL Minutes</label>
                <input type="number" id="user-ttl-minutes" placeholder="60">
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" id="save-user-btn">
                    <i class="fi fi-rr-disk"></i>
                    <span>Save</span>
                </button>
                <button class="btn btn-secondary" onclick="closeUserModal()">Cancel</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Protego Administration Panel</p>
        <p class="version" id="version-info">Loading version...</p>
        <div class="footer-links">
            <a href="/" rel="noopener noreferrer">
                <i class="fi fi-rr-home"></i>
                <span>Home</span>
            </a>
            <span class="separator">•</span>
            <a href="https://github.com/gbolo/protego" target="_blank" rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                <span>GitHub</span>
            </a>
            <span class="separator">•</span>
            <a href="/swagger" rel="noopener noreferrer">
                <i class="fi fi-rr-laptop-code"></i>
                <span>API Docs</span>
            </a>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="/admin.js"></script>
</body>
</html>
